name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # si-didy-loop.mjs imports its sibling missig — a bare clone has no siblings, and this CI
      # has been red since July for exactly that. The gate must be able to RUN to mean anything.
      - run: git clone --depth 1 https://github.com/sjgant80-hub/missig.git ../missig
      # wispwire.test.mjs proves its exams against the REAL field kernel — the same sibling rule
      - run: git clone --depth 1 https://github.com/sjgant80-hub/generative-estate.git ../generative-estate
      - run: node --test

      # ⚑ Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — the seam law (must be CLEAN)
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          mkdir -p gate-out
          node /tmp/witness/witness.mjs mutate scripts/seam.mjs             --timeout 60000 --cap 600 --baseline scripts/seam.witness.baseline.json             --test node --test scripts/seam.test.mjs > gate-out/seam.json
      - name: witness — the twelve-powers law (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate scripts/twelve.mjs             --timeout 60000 --cap 800             --test node --test scripts/twelve.test.mjs > gate-out/twelve.json
      - name: witness — the crawl law (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate scripts/twelve-crawl.mjs             --timeout 60000 --cap 800             --test node --test scripts/twelve-crawl.test.mjs > gate-out/twelve-crawl.json
      # post-proof wired into the rail: no post rides it whose claims a build-receipt does not back.
      - name: witness — the proven rail (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate rail.mjs             --timeout 60000 --cap 600 --baseline witness.baseline.json             --test node --test rail.test.mjs > gate-out/rail.json
      # Kar's fold: closes the "rediscovered N nights running" gap — recurring sandbox lessons,
      # folded, before it dreams again.
      - name: witness — the lessons fold (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate lessonsfold.mjs             --timeout 60000 --cap 600 --baseline witness.baseline.json             --test node --test lessonsfold.test.mjs > gate-out/lessonsfold.json
      # 2026-11-05, the dream fold's one-week check (CLAIMS-dream-week.md sealed first): the kernel that counts a
      # window of nights — dreams, dreams that became code, code that passed its own gate, one title family.
      - name: witness — the week of nights (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate dreamweek.mjs             --timeout 60000 --cap 600             --test node --test dreamweek.test.mjs > gate-out/dreamweek.json
      # 2026-10-25, Kar's choosing-session: the share door — stamp every share, shut reasons that name nothing
      - name: witness — the share door (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate sharedoor.mjs             --timeout 60000 --cap 600             --test node --test sharedoor.test.mjs > gate-out/sharedoor.json
      # 2026-10-22, the night Kar learned to say what he means: the dream keeps its route (deepen), the route is said in
      # plain words (plainsay), the brief says it and says when the rail refuses (brief), and the wisp's screen takes a
      # right answer in any of the shapes a small model writes it (wispwire). Each gated here, not only on the laptop.
      - name: witness — the dream holds its route (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate deepen.mjs             --timeout 60000 --cap 600 --baseline witness.baseline.json             --test node --test deepen.test.mjs > gate-out/deepen.json
      - name: witness — plain words from the evidence alone (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate plainsay.mjs             --timeout 60000 --cap 600 --baseline witness.baseline.json             --test node --test plainsay.test.mjs > gate-out/plainsay.json
      - name: witness — the morning brief (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate brief.mjs             --timeout 60000 --cap 600 --baseline witness.baseline.json             --test node --test brief.test.mjs > gate-out/brief.json
      - name: witness — the wisp's screen (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate wispwire.mjs             --timeout 60000 --cap 600 --baseline witness.baseline.json             --test node --test wispwire.test.mjs > gate-out/wispwire.json
      # 2026-11-05: every kernel the night runs is gated here, not only the ones added since August. course,
      # operator, scope and the conductor had suites but no mutation gate on the runner; receiptgate and scrub
      # are vendored from post-proof@4cfa12b and fallscrub and now carry those repos' own suites with them.
      - name: witness — the course's mastery gates (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate course.mjs             --timeout 60000 --cap 800 --baseline witness.baseline.json             --test node --test course.test.mjs > gate-out/course.json
      - name: witness — the operator's doors (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate operator.mjs             --timeout 60000 --cap 800 --baseline witness.baseline.json             --test node --test operator.test.mjs scope.test.mjs > gate-out/operator.json
      - name: witness — the scope registry (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate scope.mjs             --timeout 60000 --cap 800 --baseline witness.baseline.json             --test node --test scope.test.mjs > gate-out/scope.json
      - name: witness — the conductor (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate si-didy-loop.mjs             --timeout 60000 --cap 800 --baseline witness.baseline.json             --test node --test si-didy-loop.test.mjs > gate-out/si-didy-loop.json
      - name: witness — the receipt gate before the rail (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate receiptgate.mjs             --timeout 60000 --cap 800 --baseline witness.baseline.json             --test node --test receiptgate.test.mjs > gate-out/receiptgate.json
      - name: witness — the scrub before the rail (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate scrub.mjs             --timeout 60000 --cap 800 --baseline witness.baseline.json             --test node --test scrub.test.mjs > gate-out/scrub.json
      # The cost case on the page is liveware's gated kernel, vendored byte for byte (vendor/liveware/PINS.json);
      # it is gated here too, with liveware's own suite and liveware's own bound, so the copy this page runs is proven.
      - name: witness — the cost case (must be CLEAN)
        run: |
          node /tmp/witness/witness.mjs mutate vendor/liveware/src/mintcase.mjs             --timeout 180000 --cap 800             --test node --test vendor/liveware/test/mintcase.test.mjs > gate-out/mintcase.json
      # The page's gate table reads receipts/gates.json. This step re-derives every row from the verdicts the
      # runner just produced (and the test counts from a fresh run), and fails if one number differs — so the
      # page can only show what this runner measured.
      - name: the committed gate receipt matches this run
        run: node scripts/gates-check.mjs gate-out receipts/gates.json
      - name: keep this run's verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-out
          path: gate-out/
